<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <div class="top">
    <img src="icons/128.png" alt="">
    <div>
      <h1>TV Tools</h1>
      <div class="status" id="status"></div>
    </div>
  </div>
  <section class="card" id="sitecard" hidden>
    <h2 id="host"></h2>
    <div class="site">
      <div class="sub" id="sitesub"></div>
      <button id="sitebtn"></button>
    </div>
    <div class="site" id="uarow">
      <div class="sub" id="uasub"></div>
      <button id="uabtn"></button>
    </div>
  </section>
  <div id="groups"></div>
  <div class="links"><button id="more">All settings</button></div>
  <script src="settings.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
